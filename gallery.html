<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Apna Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-pure: #ffffff; --bg-offwhite: #f8f9fa; --bg-glass: rgba(255, 255, 255, 0.95);
            --gold-primary: #D4AF37; --text-dark: #111827; --text-muted: #4b5563;
            --border-light: rgba(0, 0, 0, 0.08); --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 40px rgba(212, 175, 55, 0.15); --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-offwhite); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

        nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--bg-glass); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-light); z-index: 1000; box-shadow: var(--shadow-soft); }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); text-decoration: none; }
        .logo span { color: var(--gold-primary); font-size: 0.65rem; display: block; letter-spacing: 4px; text-transform: uppercase; }
        .back-btn { font-size: 0.9rem; font-weight: 600; color: var(--text-dark); text-decoration: none; border: 1px solid var(--border-light); padding: 8px 15px; border-radius: 20px; transition: 0.3s; }
        .back-btn:hover { background: var(--gold-primary); color: #fff; border-color: var(--gold-primary); }

        .page-header { padding: 120px 5% 40px; background: var(--bg-pure); text-align: center; border-bottom: 1px solid var(--border-light); }
        .breadcrumbs { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
        .breadcrumbs a { color: var(--gold-primary); text-decoration: none; }
        .page-header h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 10px; }

        .container { padding: 60px 5%; max-width: 1200px; margin: 0 auto; flex-grow: 1; width: 100%; }
        .full-gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gal-card { border-radius: 14px; overflow: hidden; height: 260px; box-shadow: var(--shadow-soft); background: var(--bg-pure); border: 1px solid var(--border-light); }
        .gal-card img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .gal-card:hover img { transform: scale(1.05); }

        footer { background: var(--text-dark); color: #fff; padding: 40px 5%; text-align: center; margin-top: auto; }
        .footer-logo { font-size: 1.5rem; font-weight: 800; font-family: 'Playfair Display', serif; margin-bottom: 10px; }
        .footer-logo span { color: var(--gold-primary); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">APNA <span>Library</span></a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </nav>

    <header class="page-header">
        <div class="breadcrumbs"><a href="index.html">Home</a> &nbsp;>&nbsp; Photo Gallery</div>
        <h1 class="serif">Library Ambiance & Facilities</h1>
        <p>Explore our fully AC, silent, and ergonomic study spaces designed for absolute focus.</p>
    </header>

    <main class="container">
        <div class="full-gallery-grid">
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1568667256549-094345857637?w=600&q=80" alt="Library Hall"></div>
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=600&q=80" alt="Study Desks"></div>
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=600&q=80" alt="Interior"></div>
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=600&q=80" alt="Bookshelf"></div>
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=600&q=80" alt="Reading Space"></div>
            <div class="gal-card"><img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=600&q=80" alt="Quiet Zone"></div>
        </div>
    </main>

    <footer>
        <div class="footer-logo">APNA <span>Library</span></div>
        <p style="color:#9ca3af; font-size:0.85rem;">Photo Gallery - Apna Library</p>
    </footer>
</body>
</html>
